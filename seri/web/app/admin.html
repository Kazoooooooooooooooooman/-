<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+JP:wght@400;600&display=swap">
<link rel="stylesheet" href="/assets/app.css">
<title>Seri 運営</title>
</head><body>
<div class="wrap">
  <header class="top" id="shell"></header>
  <p id="msg" class="msg" hidden></p>

  <section class="card">
    <p class="eyebrow">運営</p>
    <h2>いまの状態</h2>
    <div class="kpis" id="kpis"></div>
    <p class="muted" id="success"></p>
  </section>

  <section class="card">
    <h2>注文と入金</h2>
    <div class="table"><table><thead><tr><th>#</th><th>買い手</th><th>内容</th><th>進み具合</th><th>請求額</th><th>状態</th><th></th></tr></thead><tbody id="orders"></tbody></table></div>
    <div class="row">
      <button type="button" class="secondary small" id="deadlines">締切を過ぎた注文を処理する</button>
      <button type="button" class="secondary small" id="release">確認期間が過ぎた保留分を確定する</button>
      <button type="button" class="secondary small" id="check">お金の台帳を検査する</button>
    </div>
    <p class="muted">本番ではこの3つは毎日自動で動かします。</p>
  </section>

  <section class="card">
    <h2>買い手からの問題の報告</h2>
    <p class="muted">認めると買い手に全額返金します。返金はまず作った人の保留分から、足りない分はSeriが負担します。そのデータは販売停止になり、作った人の品質スコアが下がります。</p>
    <div id="disputes" class="grid"></div>
  </section>

  <section class="card">
    <h2>クリエイター</h2>
    <div class="table"><table><thead><tr><th>#</th><th>名前</th><th>職種</th><th>レベル</th><th>合格</th><th>A率</th><th>買った会社</th><th>状態</th><th></th></tr></thead><tbody id="creators"></tbody></table></div>
  </section>

  <details class="card">
    <summary>業界の中のランキング</summary>
    <form id="lb-filters" class="grid">
      <label>カテゴリー<select name="category" id="lb-category"></select></label>
      <label>職種<select name="industry" id="lb-industry"></select></label>
    </form>
    <div class="table"><table><thead><tr><th>順位</th><th>名前</th><th>職種</th><th>品質スコア</th><th>審査数</th></tr></thead><tbody id="leaderboard"></tbody></table></div>
  </details>

  <details class="card">
    <summary>企業</summary>
    <div class="table"><table><thead><tr><th>#</th><th>会社</th><th>担当</th><th>メール</th><th>登録日</th></tr></thead><tbody id="buyers"></tbody></table></div>
  </details>

  <details class="card">
    <summary>参加の申し込み</summary>
    <div class="table"><table><thead><tr><th>メール</th><th>種類</th><th>メモ</th><th>日付</th></tr></thead><tbody id="waitlist"></tbody></table></div>
  </details>

  <details class="card">
    <summary>操作の記録（直近200件）</summary>
    <div class="table"><table><thead><tr><th>日時</th><th>誰が</th><th>操作</th><th>対象</th><th>IP</th></tr></thead><tbody id="audit"></tbody></table></div>
  </details>
</div>
<script type="module" src="/assets/admin.js"></script>
</body></html>
