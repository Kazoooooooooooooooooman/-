<title>Seri Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an enterprise console. Top bar with the three portals (partner · AI company · Seri operations),
   a left rail per portal, and pages built from KPI tiles, tables and one chart each where a trend matters. */
:root {
  --bg: #F3F5F8; --surface: #FFFFFF; --surface-2: #F8FAFC; --line: #E2E7EE; --line-2: #D3DAE4;
  --ink: #0F1B2D; --ink-2: #44526A; --mute: #6B778A;
  --accent: #1F4FA3; --accent-ink: #FFFFFF; --accent-soft: #E9EFFA;
  --good: #127A52; --good-soft: #E3F4EC; --warn: #9A5B00; --warn-soft: #FFF3DC; --bad: #B42318; --bad-soft: #FDECEA;
  --series-1: #2a78d6; --series-2: #eb6834;
  --shadow: 0 1px 2px rgba(15, 27, 45, .05), 0 1px 1px rgba(15, 27, 45, .03);
  --sans: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0D1117; --surface: #151B23; --surface-2: #1A212B; --line: #27303C; --line-2: #333E4C;
  --ink: #E6EDF5; --ink-2: #B7C2D0; --mute: #8B97A8;
  --accent: #7FA7F0; --accent-ink: #0D1117; --accent-soft: #1B2842;
  --good: #4CC38A; --good-soft: #13291F; --warn: #E3A14A; --warn-soft: #2D2414; --bad: #F07167; --bad-soft: #331A18;
  --series-1: #3987e5; --series-2: #d95926; --shadow: none; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0D1117; --surface: #151B23; --surface-2: #1A212B; --line: #27303C; --line-2: #333E4C;
  --ink: #E6EDF5; --ink-2: #B7C2D0; --mute: #8B97A8;
  --accent: #7FA7F0; --accent-ink: #0D1117; --accent-soft: #1B2842;
  --good: #4CC38A; --good-soft: #13291F; --warn: #E3A14A; --warn-soft: #2D2414; --bad: #F07167; --bad-soft: #331A18;
  --series-1: #3987e5; --series-2: #d95926; --shadow: none; color-scheme: dark; }
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 14px/1.7 var(--sans); }
button, select, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; height: 56px; background: var(--surface); border-bottom: 1px solid var(--line);
       display: grid; grid-template-columns: 220px minmax(0, 1fr) auto; align-items: center; gap: 16px; padding: 0 20px; }
.logo { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 20px; letter-spacing: .02em; }
.logo i { font-style: normal; color: var(--accent); }
.logo small { font-size: 11px; color: var(--mute); font-weight: 400; letter-spacing: .08em; }
.portals { display: inline-flex; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; justify-self: start; }
.portals button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.portals button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; box-shadow: var(--shadow), 0 0 0 1px var(--line); }
.who { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); white-space: nowrap; }
.avatar { width: 30px; height: 30px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 13px; }
.demo { font-size: 11px; border: 1px solid var(--line-2); color: var(--mute); padding: 2px 8px; border-radius: 999px; }
.portal-select { display: none; }

/* shell */
.shell { display: grid; grid-template-columns: 220px minmax(0, 1fr); min-height: calc(100vh - 56px); }
.rail { border-right: 1px solid var(--line); background: var(--surface); padding: 16px 12px; display: flex; flex-direction: column; gap: 2px; }
.rail-label { font-size: 11px; color: var(--mute); letter-spacing: .08em; padding: 8px 10px 6px; }
.rail a { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 8px; color: var(--ink-2); text-decoration: none; font-size: 14px; }
.rail a:hover { background: var(--surface-2); color: var(--ink); }
.rail a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 700; }
.rail .count { font: 500 11px var(--mono); color: var(--mute); }
.rail-foot { margin-top: auto; border-top: 1px solid var(--line); padding: 12px 10px 0; font-size: 12px; color: var(--mute); display: flex; flex-direction: column; gap: 2px; }
.rail-foot b { color: var(--ink); font-size: 13px; }

.main { padding: 24px 28px 64px; min-width: 0; }
.page { max-width: 1180px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
.head { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; }
.head h1 { font-size: 22px; }
.head p { color: var(--mute); max-width: 70ch; margin-top: 4px; }
.crumb { font-size: 12px; color: var(--mute); }

/* building blocks */
.kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; box-shadow: var(--shadow); min-width: 0; }
.kpi small { display: block; font-size: 12px; color: var(--mute); }
.kpi b { display: block; font: 500 22px/1.35 var(--mono); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi span { font-size: 12px; color: var(--ink-2); }
.kpi .up { color: var(--good); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 18px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h2 { font-size: 15px; }
.card-h p { font-size: 12px; color: var(--mute); }
.card-b { padding: 16px 18px; display: flex; flex-direction: column; gap: 12px; }
.grid-2 { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.grid-2e { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 400; font-size: 12px; color: var(--mute); padding: 10px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 11px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; white-space: nowrap; }
td .sub { display: block; font-size: 12px; color: var(--mute); }
tr.click { cursor: pointer; }
tr.click:hover td { background: var(--surface-2); }
tr.sel td { background: var(--accent-soft); }
.id { font: 12px var(--mono); color: var(--mute); }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); white-space: nowrap; }
.chip::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .8; }
.chip.plain::before { display: none; }
.chip.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.chip.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.chip.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.chip.info { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 8px; padding: 7px 14px; font-size: 13px; font-weight: 700; white-space: nowrap; }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line-2); font-weight: 400; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 4px 10px; font-size: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.note { font-size: 12px; color: var(--mute); }
.callout { border: 1px solid var(--line); border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 8px; padding: 12px 14px; font-size: 13px; color: var(--ink-2); }
.callout b { color: var(--ink); }
.callout.warn { border-left-color: var(--warn); }
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 16px; margin: 0; font-size: 13px; }
dl.kv dt { color: var(--mute); }
dl.kv dd { margin: 0; text-align: right; }
dl.kv dd.total { font-weight: 700; border-top: 1px solid var(--line); padding-top: 8px; }
dl.kv dt.total { border-top: 1px solid var(--line); padding-top: 8px; color: var(--ink); font-weight: 700; }

/* chart */
.chart { position: relative; }
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid-line { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--mute); font: 11px var(--mono); }
.chart .lbl { fill: var(--ink-2); font: 11px var(--mono); }
.chart .s1 { fill: var(--series-1); } .chart .s2 { fill: var(--series-2); }
.chart .hit { fill: transparent; }
.chart g.hover rect, .chart g.hover path { opacity: .82; }
.legend { display: flex; gap: 16px; font-size: 12px; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--bg); font-size: 12px; padding: 8px 10px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -100%); z-index: 3; }
.tip b { font-family: var(--mono); font-weight: 500; }

/* bars in tables (cash breakdown) */
.hbar { height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; min-width: 60px; }
.hbar i { display: block; height: 100%; background: var(--ink-2); border-radius: 3px; }
tr.mine .hbar i { background: var(--good); }
tr.mine td { font-weight: 700; }

/* pipeline */
.pipe { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 0; }
.stage { border: 1px solid var(--line); background: var(--surface); padding: 12px; min-width: 0; position: relative; display: flex; flex-direction: column; gap: 4px; }
.stage + .stage { border-left: 0; }
.stage:first-child { border-radius: 12px 0 0 12px; }
.stage:last-child { border-radius: 0 12px 12px 0; }
.stage .n { font: 11px var(--mono); color: var(--mute); }
.stage b { font-size: 13px; }
.stage .v { font: 500 18px var(--mono); }
.stage .d { font-size: 11.5px; color: var(--mute); }
.stage.ai { background: var(--accent-soft); }
.stage.money { background: var(--good-soft); }

/* flow (business model) */
.flow { display: flex; flex-direction: column; gap: 0; }
.fstep { display: grid; grid-template-columns: 44px minmax(0, 1fr) minmax(0, 220px); gap: 14px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.fstep:last-child { border-bottom: 0; }
.fstep .no { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font: 500 13px var(--mono); color: var(--ink-2); }
.fstep b { display: block; font-size: 14px; }
.fstep p { font-size: 13px; color: var(--ink-2); }
.fstep .money { font-size: 12px; color: var(--mute); border-left: 2px solid var(--line); padding-left: 10px; }
.fstep .money b { font-size: 13px; color: var(--ink); }

/* form */
.form { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--mute); }
.field input, .field select { border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 8px 10px; font-size: 14px; color: var(--ink); width: 100%; }

.toast { position: fixed; right: 20px; bottom: 20px; z-index: 40; background: var(--ink); color: var(--bg); padding: 12px 16px; border-radius: 10px; font-size: 13px; max-width: 360px;
         opacity: 0; transform: translateY(12px); pointer-events: none; transition: opacity .25s, transform .25s; }
.toast.show { opacity: 1; transform: none; }

@media (max-width: 1080px) {
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-2, .grid-2e { grid-template-columns: minmax(0, 1fr); }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .stage, .stage + .stage, .stage:first-child, .stage:last-child { border: 1px solid var(--line); border-radius: 10px; }
}
@media (max-width: 760px) {
  .top { grid-template-columns: auto minmax(0, 1fr); padding: 0 16px; }
  .portals, .who .name { display: none; }
  .portal-select { display: block; justify-self: end; border: 1px solid var(--line-2); background: var(--surface); border-radius: 8px; padding: 6px 8px; font-size: 13px; }
  .who { display: none; }
  .shell { grid-template-columns: minmax(0, 1fr); }
  .rail { flex-direction: row; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px 12px; gap: 4px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 56px); z-index: 15; }
  .rail-label, .rail-foot, .rail .count { display: none; }
  .rail a { white-space: nowrap; }
  .main { padding: 18px 16px 48px; }
  .form { grid-template-columns: minmax(0, 1fr); }
  .kpi b { font-size: 17px; white-space: normal; overflow-wrap: anywhere; }
  .hide-sm { display: none; }
  .head h1 { font-size: 20px; }
  .fstep { grid-template-columns: 36px minmax(0, 1fr); }
  .fstep .money { grid-column: 2; }
  .toast { left: 16px; right: 16px; max-width: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <div class="logo">Seri<i>.</i><small>DATA LICENSING</small></div>
  <div class="portals" role="group" aria-label="画面の切り替え">
    <button type="button" data-portal="partner">データ提供パートナー</button>
    <button type="button" data-portal="buyer">AI企業</button>
    <button type="button" data-portal="ops">Seri運営</button>
  </div>
  <select class="portal-select" id="portal-select" aria-label="画面の切り替え">
    <option value="partner">データ提供パートナー</option><option value="buyer">AI企業</option><option value="ops">Seri運営</option>

  <div class="who"><span class="demo">デモ</span><span class="name" id="who-name"></span><span class="avatar" id="who-avatar"></span></div>
</header>

<div class="shell">
  <nav class="rail" id="rail" aria-label="メニュー"></nav>
  <main class="main"><div class="page" id="page"></div></main>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const yen = (n) => (n < 0 ? "−" : "") + "¥" + Math.abs(Math.round(n)).toLocaleString("ja-JP");

  const pct = (x, d = 1) => (x * 100).toFixed(d) + "%";
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const chip = (t, k = "") => `<span class="chip ${k}">${esc(t)}</span>`;
  let toastT;
  const toast = (m) => { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), 3600); };

  // ================= business rules (仮) =================

  // AI企業: P ＋ サービス料10% ＋ 消費税10%（国内）

  const R = {
    partnerShare: 0.90, buyerFee: 0.10, vat: 0.10, withholding: 0.1021,
    tiers: { any: ["誰でも", 1.0], top50: ["上位50%", 1.2], top25: ["上位25%", 1.5], top10: ["上位10%", 2.0] },

    licenses: { standard: ["標準（非独占）", 1.0], term: ["期間独占（6ヶ月）", 2.0], eval: ["評価用", 2.0], buyout: ["完全買い切り", 3.0] },

  const withholding = (x) => Math.floor(x * R.withholding);

  // ================= sample data =================
  const partner = {

    months: ["4月", "5月", "6月", "7月", "8月", "9月"],
    task: [58320, 97200, 124740, 142560, 163080, 186300],

    assets: [

      ["SA-10420", "医療用語の読み上げ", 50, "B", 81, 33000, "standard", 5, 22950, "active"],
      ["SA-10388", "看護記録の口述", 20, "A", 93, 0, "buyout", 1, 43200, "sold"],
      ["SA-10366", "日常会話（関西弁）", 20, "B", 78, 18400, "standard", 2, 8100, "active"],
      ["SA-10352", "病棟の電話対応", 30, "A", 90, 46800, "standard", 3, 27540, "active"],
      ["SA-10341", "看護師の申し送り（日勤）", 20, "A", 93, 61200, "eval", 1, 32400, "exclusive"],
    ],
    rfqs: [
      { id: "RFQ-2609-031", buyer: "Kumo Health AI株式会社", title: "服薬指導の説明（高齢の患者向け）", units: 300, price: 600, tier: "top25", industry: "nurse", license: "standard", due: "10/21", cap: 60 },
      { id: "RFQ-2609-028", buyer: "北斗LLMラボ株式会社", title: "看護師の申し送り（夜勤）", units: 500, price: 600, tier: "top25", industry: "nurse", license: "standard", due: "10/14", cap: 100, accepted: 18 },
      { id: "RFQ-2609-024", buyer: "Sora Translate株式会社", title: "医療現場の日英通訳の会話", units: 200, price: 800, tier: "any", industry: "", license: "term", due: "10/28", cap: 40 },

    ],
  };
  const buyer = {
    name: "北斗LLMラボ株式会社", person: "調達部 田中", deposit: 2480000, credit: "デポジット方式",
    orders: [
      { id: "ORD-2609-014", title: "看護師の申し送り（夜勤）", kind: "ja_pro", units: 500, price: 600, tier: "top25", industry: "nurse", license: "standard", done: 312, status: "制作中", due: "10/14" },
      { id: "ORD-2609-011", title: "日本語の日常会話", kind: "ja_talk", units: 2000, price: 300, tier: "any", industry: "", license: "standard", done: 2000, status: "検収中", due: "10/08" },
      { id: "CAT-2609-006", title: "カタログ購入 · 日本語の会話（品質A）", kind: "ja_talk", units: 1200, price: 190, tier: "any", industry: "", license: "standard", done: 1200, status: "完了", due: "—" },
    ],

    const max = Math.max(...totals), step = niceStep(max / 4), top = Math.ceil(max / step) * step;
    const y = (v) => T + (H - T - B) * (1 - v / top), bw = Math.min(46, (W - L) / n * 0.5);
    let g = "";
    for (let v = 0; v <= top; v += step) g += `<line class="grid-line" x1="${L}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${man(v)}</text>`;
    let bars = "";
    labels.forEach((lab, i) => {
      const cx = L + (W - L) / n * (i + .5);
      let base = 0, segs = "";
      series.forEach((arr, s) => {
        const v = arr[i]; if (!v) return;
        const y0 = y(base), y1 = y(base + v), hgt = Math.max(0, y0 - y1 - (base > 0 ? 2 : 0));
        const isTop = s === series.length - 1 || series.slice(s + 1).every((a) => !a[i]);

        base += v;
      });

               <text class="axis" x="${cx}" y="${H - 6}" text-anchor="middle">${lab}</text>`;
      if (i === n - 1) bars += `<text class="lbl" x="${cx}" y="${y(totals[i]) - 8}" text-anchor="middle">${fmt(totals[i])}</text>`;
    });
    const id = "c" + Math.random().toString(36).slice(2, 8);
    setTimeout(() => {
      const box = document.getElementById(id); if (!box) return;
      const tip = box.querySelector(".tip");
      box.querySelectorAll(".hit").forEach((r) => {
        r.addEventListener("mouseenter", () => {
          const i = +r.dataset.i, bb = r.getBoundingClientRect(), cb = box.getBoundingClientRect();
          tip.innerHTML = `${labels[i]}<br>` + series.map((a, s) => `${names[s]} <b>${fmt(a[i])}</b>`).join("<br>") + (series.length > 1 ? `<br>合計 <b>${fmt(totals[i])}</b>` : "");

    return `${legend}<div class="chart" id="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(names.join("と"))}の推移">${g}${bars}</svg><div class="tip" hidden></div></div>`;

        $("#quote").innerHTML = `<dl class="kv"><dt>1件あたり</dt><dd class="num">${yen(unit)}</dd><dt>データ価格（${o.units.toLocaleString()}件）</dt><dd class="num">${yen(data)}</dd><dt>サービス料（10%）</dt><dd class="num">${yen(fee)}</dd><dt>消費税（10%）</dt><dd class="num">${yen(tax)}</dd><dt class="total">お支払い合計</dt><dd class="total num">${yen(total)}</dd></dl>
          <p class="note">うちパートナーへ ${yen(data * R.partnerShare)}（データ価格の90%）· 納期の目安 ${o.tier === "top10" ? 42 : o.tier === "top25" ? 28 : o.tier === "top50" ? 21 : 14}日</p>
          <div class="callout ${ok ? "" : "warn"}">${ok ? `デポジット残高 ${yen(buyer.deposit)} から充当します。` : `デポジット残高が ${yen(total - buyer.deposit)} 足りません。確定すると不足分の請求書を発行します。`}</div>
          <button class="btn" id="q-submit" ${o.units < 10 || o.price < 100 ? "disabled" : ""}>依頼を確定する</button>`;
        $("#q-submit").onclick = () => {
          const id = `ORD-2609-0${15 + buyer.orders.length}`;
          buyer.orders.unshift({ id, title: R.kinds[$("#q-kind").value], kind: $("#q-kind").value, ...o, done: 0, status: "募集中", due: "11/" + (o.tier === "any" ? "13" : "27") });
          if (ok) buyer.deposit -= total;
          toast(`${id} を確定しました。条件に合うパートナーへ依頼が届きます。`);
          location.hash = "buyer-overview";
        };
      };
      ["#q-kind", "#q-units", "#q-price", "#q-tier", "#q-industry", "#q-license"].forEach((s) => $(s).addEventListener("input", calc));
      calc();
    }
  }

  go(location.hash || "#partner-overview");
})();
</script>
