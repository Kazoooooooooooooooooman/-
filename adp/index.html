const ROUND_SECONDS = 10; // production: 300s. demo loop: 10s
const RESERVE = 10;
const PROTOCOL_FEE = 0.1;

};

/* ---------------------------- helpers ---------------------------- */

let _uid = 0;
const uid = () => ++_uid;
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const usd = (n) => "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const pad = (n, w = 2) => String(n).padStart(w, "0");
const fmtTime = (ts) => {
  const d = new Date(ts);
  return `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${pad(d.getMilliseconds(), 3)}`;
};
const randId = (len) => {
  const a = "ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789";
  let s = "";
  for (let i = 0; i < len; i++) s += a[Math.floor(Math.random() * a.length)];
  return s;
};
const slug = (name) => name.toLowerCase().replace(/[^a-z0-9]+/g, "_");

const makeLot = (n) => ({ ...LOTS[n % LOTS.length], id: `lot_${pad(48210 + n, 6)}`, n });

function makeSettlement(lot, bids, created = Date.now()) {
  const top = bids[0];
  const cents = Math.round(top.amount * 100);
  const fee = Math.round(cents * PROTOCOL_FEE);
  return {
    id: uid(),
    lotId: lot.id,
    title: lot.title,
    winner: top.agent,
    amount: top.amount,
    bidCount: bids.length,
    created,
    evt: "evt_3Q" + randId(22),
    pi: "pi_3Q" + randId(22),
    ch: "ch_3Q" + randId(22),
    cents,
    fee,
    suppliers: lot.suppliers,
    schema: lot.schema,
  };
}

function seedSettlements() {
  const out = [];
  const now = Date.now();
  for (let i = 4; i >= 1; i--) {
    const lot = makeLot(-i + LOTS.length * 10);
    const bids = [];
    let amt = RESERVE + pick([0, 0.5, 1]);
    const n = 6 + Math.floor(Math.random() * 6);
    for (let k = 0; k < n; k++) {
      amt += pick([0.5, 1, 1.5, 2]);
      bids.unshift({ agent: pick(BASE_AGENTS), amount: amt });
    }
    out.unshift(makeSettlement({ ...lot, id: `lot_${pad(48210 - i, 6)}` }, bids, now - i * 11000));
  }
  return out;
}

/* ---------------------------- reducer ---------------------------- */

function initState() {
  const lot = makeLot(0);
  return {
    round: 0,
    lot,
    status: "live",
    timeLeft: ROUND_SECONDS,
    bids: [],
    agents: BASE_AGENTS.slice(),
    log: [{ id: uid(), kind: "open", lot: lot.id, title: lot.title, t: Date.now() }],
    settlements: seedSettlements(),
    lastSettlement: null,
    sessionVolume: 0,
    totalBids: 0,
  };
}

function reducer(s, a) {
  switch (a.type) {
    case "TICK": {
      if (s.status === "sold") {
        const lot = makeLot(s.round + 1);
        return {
          ...s,
          round: s.round + 1,
          lot,
          status: "live",
          timeLeft: ROUND_SECONDS,
          bids: [],
          log: [{ id: uid(), kind: "open", lot: lot.id, title: lot.title, t: Date.now() }, ...s.log].slice(0, 90),
        };
      }
      const t = s.timeLeft - 1;
      if (t > 0) return { ...s, timeLeft: t };
      // countdown hit zero → settle
      if (!s.bids.length) {
        return {
          ...s,
          timeLeft: 0,
          status: "sold",
          log: [{ id: uid(), kind: "nosale", lot: s.lot.id, t: Date.now() }, ...s.log].slice(0, 90),
        };
      }
      const st = makeSettlement(s.lot, s.bids);
      return {
        ...s,
        timeLeft: 0,
        status: "sold",
        settlements: [st, ...s.settlements].slice(0, 24),
        lastSettlement: st,
        sessionVolume: s.sessionVolume + st.amount,
        log: [
          { id: uid(), kind: "settle", lot: s.lot.id, agent: st.winner, amount: st.amount, pi: st.pi, t: Date.now() },
          ...s.log,
        ].slice(0, 90),
      };
    }
    case "BID": {
      if (s.status !== "live") return s;
      const top = s.bids[0];
      const pool = s.agents.filter((n) => n !== top?.agent);
      const agent = pool[Math.floor(a.r * pool.length)];
      const now = Date.now();
      if (top && a.reject) {
        const low = Math.max(RESERVE, top.amount - pick([0.5, 1]));
        return {
          ...s,
          totalBids: s.totalBids + 1,
          log: [{ id: uid(), kind: "reject", agent, amount: low, high: top.amount, lot: s.lot.id, latency: a.latency, t: now }, ...s.log].slice(0, 90),
        };
      }
      const amount = top ? top.amount + a.inc : RESERVE + pick([0, 0.5, 1, 2.5]);
      return {
        ...s,
        totalBids: s.totalBids + 1,
        bids: [{ agent, amount, t: now }, ...s.bids],
        log: [
          { id: uid(), kind: top ? "outbid" : "bid", agent, amount, lot: s.lot.id, latency: a.latency, t: now },
          ...s.log,
        ].slice(0, 90),
      };
    }
    case "SURGE": {
      const fresh = SURGE_AGENTS.filter((n) => !s.agents.includes(n));
      const joining = fresh.slice(0, 2);
      if (!joining.length) return s;
      return {
        ...s,
        agents: [...s.agents, ...joining],
        log: [
          ...joining.map((agent) => ({ id: uid(), kind: "join", agent, t: Date.now() })),
          ...s.log,
        ].slice(0, 90),
      };
    }
    default:
      return s;
  }
}

/* ---------------------------- auction core ---------------------------- */

function TimerRing({ timeLeft, sold }) {
  const r = 46;
  const circ = 2 * Math.PI * r;
  const frac = timeLeft / ROUND_SECONDS;
  const urgent = timeLeft <= 3 && !sold;
  const color = sold ? C.emerald : urgent ? C.danger : C.purple;
  return (
    <div className="relative grid h-[120px] w-[120px] shrink-0 place-items-center">
      <svg viewBox="0 0 110 110" className="absolute inset-0 h-full w-full -rotate-90">
        <circle cx="55" cy="55" r={r} fill="none" stroke="#1C1C28" strokeWidth="6" />
        <circle
          cx="55"
          cy="55"
          r={r}
          fill="none"
          stroke={color}
          strokeWidth="6"
          strokeLinecap="round"
          strokeDasharray={circ}
          strokeDashoffset={circ * (1 - frac)}
          style={{ transition: timeLeft === ROUND_SECONDS ? "none" : "stroke-dashoffset 1s linear, stroke .3s" }}
        />
      </svg>
      <div className="text-center">
        <div key={timeLeft} className={`adp-mono adp-pop text-[26px] font-bold ${urgent ? "adp-pulse" : ""}`} style={{ color }}>
          00:{pad(timeLeft)}
        </div>
        <div className="text-[10px] font-medium uppercase tracking-[0.14em]" style={{ color: C.muted }}>
          {sold ? "SOLD" : "残り"}
        </div>
      </div>
    </div>
  );
}

function LogLine({ e, fresh }) {
  const cls = `adp-mono px-4 py-1.5 text-[12px] leading-5 ${fresh ? "adp-in" : ""}`;
  const time = (
    <span className="mr-2" style={{ color: C.dim }}>
      {fmtTime(e.t)}
    </span>
  );
  const name = (n) => (
    <span className="font-bold" style={{ color: agentColor(n) }}>
      {n}
    </span>
  );
  switch (e.kind) {
    case "open":
      return (
        <div className={cls} style={{ background: C.purple + "12", borderLeft: `2px solid ${C.purple}` }}>
          {time}
          <span style={{ color: C.purpleSoft }}>▶ AUCTION OPEN</span>{" "}
          <span style={{ color: C.muted }}>
            {e.lot} · reserve $10.00
          </span>
        </div>
      );
    case "settle":
      return (
        <div className={cls} style={{ background: C.emerald + "14", borderLeft: `2px solid ${C.emerald}` }}>
          {time}
          <span style={{ color: C.emerald }}>■ SETTLED</span> {name(e.agent)}{" "}
          <span style={{ color: C.emerald }}>{usd(e.amount)}</span>
          <span style={{ color: C.muted }}> · stripe {e.pi.slice(0, 12)}… · delivered</span>
        </div>
      );
    case "nosale":
      return (
        <div className={cls}>
          {time}
          <span style={{ color: C.muted }}>■ {e.lot} closed below reserve</span>
        </div>
      );
    case "join":
      return (
        <div className={cls}>
          {time}
          <span style={{ color: "#5CC8FF" }}>+ {e.agent} connected via API</span>
        </div>
      );
    case "reject":
      return (
        <div className={cls}>
          {time}
          {name(e.agent)} <span style={{ color: C.dim }}>bid {usd(e.amount)} → rejected (&lt; {usd(e.high)})</span>
        </div>
      );
    default:
      return (
        <div className={cls}>
          {time}
          {name(e.agent)}{" "}
          <span style={{ color: "#C9C9D8" }}>{e.kind === "bid" ? "placed a bid of" : "outbid with"}</span>{" "}
          <span className="font-bold" style={{ color: C.text }}>
            {usd(e.amount)}
          </span>
          <span style={{ color: C.dim }}> · {e.latency}ms</span>
        </div>
      );
  }
}

function stripeEvent(s) {
  const created = Math.floor(s.created / 1000);
  return {
    id: s.evt,
    object: "event",
    api_version: "2024-06-20",
    created,
    livemode: false,
    type: "payment_intent.succeeded",
    data: {
      object: {
        id: s.pi,
        object: "payment_intent",
        amount: s.cents,
        amount_received: s.cents,
        currency: "usd",
        status: "succeeded",
        capture_method: "automatic",
        customer: "cus_agent_" + slug(s.winner),
        payment_method: "pm_agent_wallet_" + slug(s.winner).slice(0, 10),
        latest_charge: s.ch,
        application_fee_amount: s.fee,
        transfer_group: s.lotId,
        transfer_data: { destination: "acct_adp_supplier_pool" },
        metadata: {
          adp_lot_id: s.lotId,
          adp_schema: s.schema,
          winner_agent: s.winner,
          reserve_price_usd: RESERVE.toFixed(2),
          bid_count: String(s.bidCount),
          supplier_count: String(s.suppliers),
          delivery_status: "delivered",
          delivery_uri: `adp://deliveries/${s.lotId}/${s.pi.slice(-8)}.parquet`,
          human_in_loop: "false",
        },
        created,
      },
    },
    request: { id: "req_" + randId(14), idempotency_key: `adp-${s.lotId}-settle` },
  };
}

function highlightJSON(str) {
  const re = /("(?:\\.|[^"\\])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?)/g;
  const out = [];
  let last = 0;
  let m;
  let k = 0;
  while ((m = re.exec(str))) {
    if (m.index > last) out.push(str.slice(last, m.index));
    if (m[1]) {
      out.push(
        <span key={k++} style={{ color: m[2] ? C.purpleSoft : C.emerald }}>
          {m[1]}
        </span>
      );
      if (m[2]) out.push(m[2]);
    } else if (m[3]) {
      out.push(
        <span key={k++} style={{ color: "#FF7AD9" }}>
          {m[3]}
        </span>
      );
    } else {
      out.push(
        <span key={k++} style={{ color: "#FFB547" }}>
          {m[4]}
        </span>
      );
    }
    last = re.lastIndex;
  }
  out.push(str.slice(last));
  return out;
}

function StripeModal({ settlements, onClose }) {
  const [sel, setSel] = useState(settlements[0]?.id);
  const [copied, setCopied] = useState(false);
  const cur = settlements.find((s) => s.id === sel) || settlements[0];
  const json = JSON.stringify(stripeEvent(cur), null, 2);
  const preRef = useRef(null);

  useEffect(() => {
    const onKey = (e) => e.key === "Escape" && onClose();
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [onClose]);

  const copy = async () => {
    try {
      await navigator.clipboard.writeText(json);
      setCopied(true);
      setTimeout(() => setCopied(false), 1400);
    } catch {
      const ws = window.getSelection();
      const range = document.createRange();
      range.selectNodeContents(preRef.current);
      ws.removeAllRanges();
      ws.addRange(range);
    }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-end justify-center p-3 sm:items-center sm:p-6" role="dialog" aria-modal="true" aria-label="Stripe 決済APIログ">
      <div className="adp-fade absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />

            <Braces size={16} />
          </div>
          <div className="min-w-0 flex-1">
            <div className="text-[14px] font-bold" style={{ color: C.text }}>
              Stripe API · Webhook イベント
            </div>
            <div className="adp-mono text-[11px]" style={{ color: C.muted }}>
              POST /webhooks/stripe → 200 OK · test mode · プロトコル手数料 {PROTOCOL_FEE * 100}%
            </div>
          </div>
          <button type="button" onClick={onClose} aria-label="閉じる" className="rounded-lg p-1.5 hover:bg-white/10" style={{ color: C.muted }}>
            <X size={18} />
          </button>
        </div>
        <div className="flex min-h-0 flex-1 flex-col md:flex-row">
          <ul className="adp-scroll flex max-h-40 shrink-0 flex-col overflow-y-auto border-b md:max-h-none md:w-64 md:border-b-0 md:border-r" style={{ borderColor: C.line }}>
            {settlements.map((s) => {
              const on = s.id === cur.id;
              return (
                <li key={s.id}>
                  <button
                    type="button"
                    onClick={() => setSel(s.id)}
                    className="adp-mono flex w-full flex-col gap-0.5 px-4 py-2.5 text-left text-[11px] transition hover:bg-white/5"
                    style={{ background: on ? C.purple + "1F" : "transparent", borderLeft: `2px solid ${on ? C.purple : "transparent"}` }}
                  >
                    <span className="flex items-center justify-between gap-2">
                      <span style={{ color: C.emerald }}>● succeeded</span>
                      <span className="font-bold" style={{ color: C.text }}>
                        {usd(s.amount)}
                      </span>
                    </span>
                    <span className="truncate" style={{ color: "#C9C9D8" }}>
                      {s.winner}
                    </span>
                    <span style={{ color: C.dim }}>
                      {s.lotId} · {fmtTime(s.created).slice(0, 8)}
                    </span>
                  </button>
                </li>
              );
            })}
          </ul>
          <div className="relative min-h-0 min-w-0 flex-1">
            <button
              type="button"
              onClick={copy}
              className="adp-mono absolute right-3 top-3 z-10 inline-flex items-center gap-1 rounded-md border px-2 py-1 text-[11px] hover:bg-white/5"
              style={{ borderColor: C.line, color: copied ? C.emerald : C.muted, background: C.panel }}
            >

              {highlightJSON(json)}
            </pre>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ---------------------------- app ---------------------------- */

function AgentDataProtocol() {
  const [state, dispatch] = useReducer(reducer, undefined, initState);
  const [toast, setToast] = useState(null);
  const [stripeOpen, setStripeOpen] = useState(false);
  const [surging, setSurging] = useState(false);
  const surgeRef = useRef(0);

  // 1s auction clock
  useEffect(() => {
    const id = setInterval(() => dispatch({ type: "TICK" }), 1000);
    return () => clearInterval(id);
  }, []);

  // autonomous bidding loop (no human in the loop)
  useEffect(() => {
    let timer;
    const loop = () => {
      const hot = surgeRef.current > 0;
      if (hot) {
        surgeRef.current -= 1;
        if (surgeRef.current === 0) setSurging(false);
      }
      dispatch({
        type: "BID",
        r: Math.random(),
        inc: pick(hot ? [1, 1.5, 2, 2.5, 3] : [0.5, 0.5, 1, 1, 1.5, 2]),
        reject: !hot && Math.random() < 0.12,
        latency: 6 + Math.floor(Math.random() * (hot ? 14 : 40)),
      });
      timer = setTimeout(loop, hot ? 160 + Math.random() * 220 : 700 + Math.random() * 900);
    };
    timer = setTimeout(loop, 600);
    return () => clearTimeout(timer);
  }, []);

  // settlement → toast
  const lastId = state.lastSettlement?.id;
  useEffect(() => {
    if (state.lastSettlement) setToast(state.lastSettlement);
  }, [lastId]); // eslint-disable-line react-hooks/exhaustive-deps

  const onSurge = () => {
    surgeRef.current += 10;
    setSurging(true);
    dispatch({ type: "SURGE" });
  };

  const closeToast = React.useCallback(() => setToast(null), []);
  const closeStripe = React.useCallback(() => setStripeOpen(false), []);

  return (
    <div className="adp-root adp-grid-bg min-h-screen w-full" style={{ background: C.bg, color: C.text }}>
      <style>{GLOBAL_CSS}</style>
      <div className="mx-auto flex max-w-[1400px] flex-col gap-5 px-4 py-6 sm:px-6 lg:py-8">
        <Header sessionVolume={state.sessionVolume} agentsOnline={state.agents.length} />

        <main className="grid grid-cols-1 gap-4 lg:grid-cols-12">
          <Panel
            icon={Database}
            title="供給サイド（データソース）"
            className="lg:col-span-4"
            right={
              <span className="inline-flex items-center gap-1 text-[11px]" style={{ color: C.muted }}>
                <Users size={12} /> 個人 & SMB
              </span>
            }
          >
            <CodeEditor />
            <FeatureStream />
          </Panel>

          <div className="flex lg:col-span-4">
            <AuctionCore state={state} onSurge={onSurge} onStripe={() => setStripeOpen(true)} surging={surging} />
          </div>

          <div className="flex lg:col-span-4">
            <BidLog log={state.log} totalBids={state.totalBids} />
          </div>
        </main>

        <footer className="flex flex-wrap items-center justify-between gap-3 border-t pt-4 text-[11px]" style={{ borderColor: C.line, color: C.dim }}>
          <span className="inline-flex items-center gap-1.5">
            <Timer size={12} /> 本番: 5分毎に1ロット × 288回/日/市場 · デモ: 10秒ループ
          </span>
          <span>※ 表示中のエージェント名・金額・Stripeログはすべてデモ用の架空データです。</span>
        </footer>
      </div>

      {toast && <SettlementToast s={toast} onClose={closeToast} />}
      {stripeOpen && <StripeModal settlements={state.settlements} onClose={closeStripe} />}
    </div>
  );
}
