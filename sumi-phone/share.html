<script>
// 確認メールの「友だちに教える」から開くページ。?c=紹介コード（6けた）、?l=en で英語。
// 本人がこのページを開いても、紹介の記録には数えない（?r= ではなく ?c= を使うため）
(() => {
  const q = new URLSearchParams(location.search);
  const code = String(q.get("c") || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 12);
  const en = q.get("l") === "en";
  const $ = (id) => document.getElementById(id);
  const ph = (a) => a.map((t) => "<span class='ph'>" + t + "</span>").join("");
  const tiers = en
    ? [["1", "Priority prototype invite", "When the prototype is ready"], ["10", "A Soto aluminum bottle", "For the first 100 people to get there"], ["30", "A first-edition Soto T-shirt", "For the first 10 people to get there"]]
    : [["1", "先行体験に優先ご招待", "試作機ができたときにご案内"], ["10", "Soto アルミマイボトル", "先着100名様にお贈りします"], ["30", "Soto 初代 限定Tシャツ", "先着10名様にお贈りします"]];
  const card = $("sh-card");
  if (en) card.classList.add("is-en");
  card.innerHTML = (en
    ? "<p class='done-ask-h'>A small request</p><p class='done-ask-p'>If someone close to you struggles with how much they use their phone, we’d be grateful if you told them about Soto Phone with the buttons below.</p><p class='done-ask-k'>Our thanks, by number of referrals</p>"
    : "<p class='done-ask-h'>ご紹介のお願い</p><p class='done-ask-p'>" + ph(["スマートフォンとの付き合い方に", "悩んでいる方が", "身近にいらっしゃいましたら、", "下のボタンから&nbsp;", "Soto Phone を", "お伝えいただけますと幸いです。"]) + "</p><p class='done-ask-k'>ご紹介いただいた人数に応じた御礼</p>")
    + "<ul class='done-tiers'>" + tiers.map(([n, t, sub]) => "<li><span class='dt-n'>" + n + "<small>" + (en ? (n === "1" ? " referral" : " referrals") : "名のご紹介で") + "</small></span><span class='dt-t'>" + t + "<small>" + sub + "</small></span></li>").join("") + "</ul>"
    + (en ? "<p class='done-ask-note'>We’ll email you each time someone joins through your link.</p>"
          : "<p class='done-ask-note'>" + ph(["ご紹介の方がご登録されるたびに、", "メールでご報告いたします。"]) + "</p>");
  if (en) {
    document.documentElement.lang = "en";
    $("sh-line").querySelector(".btn-label").textContent = "Send on LINE";
    $("sh-share").querySelector(".btn-label").textContent = "Send with another app";
    $("sh-copy").querySelector(".btn-label").textContent = "Copy the message and link";
    $("sh-none").textContent = "This link doesn't include your referral code. Please open it again from the button in your confirmation email.";
  }
  if (!code) { $("sh-none").hidden = false; card.hidden = true; document.querySelector(".sh-btns").hidden = true; return; }
  const url = "https://sotophone.jp/" + (en ? "en" : "") + "?r=" + code;
  const text = { value: "" };
  text.value = en
    ? "I've joined the pre-order list for Soto Phone, a phone with no social media and no games.\nIt might suit you if you'd like to spend less time on your phone.\nThe pre-order is free and only takes your email."
    : "SNSもゲームも入っていない携帯電話「Soto Phone」の先行予約に登録しました。\nスマホをつい触りすぎてしまう人に、よさそうだと思いました。\n先行予約は無料で、メールアドレスだけで登録できます。";
  $("sh-url").innerHTML = (en ? "Your referral link<br>" : "ご紹介用のリンク<br>") + "<span class='u'>" + url + "</span>";
  const msg = (t) => { $("sh-msg").textContent = t; setTimeout(() => { $("sh-msg").textContent = ""; }, 2500); };
  const lineUrl = () => "https://line.me/R/share?text=" + encodeURIComponent(text.value + "\n" + url);
  $("sh-line").href = lineUrl();
  if (navigator.share) {
    $("sh-share").hidden = false;
    $("sh-share").addEventListener("click", () => navigator.share({ title: "Soto Phone", text: text.value, url }).catch(() => {}));
  }
  $("sh-copy").addEventListener("click", async () => {
    try { await navigator.clipboard.writeText(text.value + "\n" + url); msg(en ? "Copied. Paste it into any app." : "コピーしました。好きなアプリに貼り付けて送れます。"); }
    catch (_) { window.prompt(en ? "Copy this" : "こちらをコピーしてください", text.value + "\n" + url); }
  });
})();
</script>
